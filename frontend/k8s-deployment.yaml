apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-3tier-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-3tier-frontend
  template:
    metadata:
      labels:
        app: java-3tier-frontend
    spec:
      containers:
        - name: java-3tier-frontend
          image: 172.31.11.48:8082/java-3tier-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: java-3tier-frontend
spec:
  type: NodePort
  selector:
    app: java-3tier-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
